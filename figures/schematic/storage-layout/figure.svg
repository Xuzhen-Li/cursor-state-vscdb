<svg xmlns="http://www.w3.org/2000/svg" width="980" height="700" viewBox="0 0 980 700">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="28" y="34" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1e3a5f" text-anchor="start">Mac storage hierarchy (Cursor state)</text>
<text x="28" y="56" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#2A629A" text-anchor="start">Where bulk lives — do not delete the wrong folder</text>
<rect x="40" y="80" width="340" height="46" rx="10" fill="#1e3a5f"/>
<text x="210" y="108" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">~/Library/Application Support/Cursor/</text>
<rect x="96" y="150" width="340" height="48" rx="8" fill="#1e3a5f"/>
<text x="108" y="170" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="start">User/globalStorage/</text>
<text x="108" y="188" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF" text-anchor="start">~58 GB · contains state.vscdb</text>
<line x1="80" y1="174" x2="96" y2="174" stroke="#64748B" stroke-width="2"/>
<rect x="132" y="210" width="340" height="48" rx="8" fill="#9B1C1C"/>
<text x="144" y="230" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="start">state.vscdb</text>
<text x="144" y="248" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF" text-anchor="start">~52 GB · three tables</text>
<!-- HOT badge inside state.vscdb box, left of right edge; never overlaps transcripts panel at x=560 -->
<rect x="400" y="222" width="56" height="24" rx="6" fill="#FFFFFF"/>
<text x="428" y="239" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#9B1C1C" text-anchor="middle">HOT</text>
<line x1="116" y1="234" x2="132" y2="234" stroke="#64748B" stroke-width="2"/>
<rect x="132" y="270" width="340" height="48" rx="8" fill="#2A629A"/>
<text x="144" y="290" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="start">state.vscdb-wal / -shm</text>
<text x="144" y="308" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF" text-anchor="start">small · move with DB</text>
<line x1="116" y1="294" x2="132" y2="294" stroke="#64748B" stroke-width="2"/>
<rect x="96" y="340" width="340" height="48" rx="8" fill="#1e3a5f"/>
<text x="108" y="360" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="start">User/workspaceStorage/</text>
<text x="108" y="378" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF" text-anchor="start">~294 MB · not the culprit</text>
<line x1="80" y1="364" x2="96" y2="364" stroke="#64748B" stroke-width="2"/>
<rect x="96" y="400" width="340" height="48" rx="8" fill="#1e3a5f"/>
<text x="108" y="420" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="start">Cache/</text>
<text x="108" y="438" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF" text-anchor="start">~41 MB · contrast</text>
<line x1="80" y1="424" x2="96" y2="424" stroke="#64748B" stroke-width="2"/>
<rect x="560" y="80" width="390" height="220" rx="12" fill="#E8F0F8" stroke="#2A629A" stroke-width="1.5"/>
<text x="580" y="110" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a5f" text-anchor="start">~/.cursor/projects/</text>
<text x="580" y="134" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#2A629A" text-anchor="start">agent-transcripts/*.jsonl</text>
<rect x="580" y="156" width="200" height="64" rx="10" fill="#166534"/>
<text x="680" y="182" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">~728 MB</text>
<text x="680" y="206" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#FFFFFF" text-anchor="middle">~70× smaller</text>
<text x="580" y="250" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#1e3a5f" text-anchor="start">Insurance only — not a full UI restore</text>
<text x="580" y="274" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#64748B" text-anchor="start">Keep when moving state.vscdb aside</text>
<rect x="40" y="470" width="910" height="90" rx="10" fill="#FEF2F2" stroke="#9B1C1C" stroke-width="1.5"/>
<text x="56" y="500" font-family="Noto Sans CJK SC, Arial, sans-serif" font-size="14" font-weight="bold" fill="#9B1C1C" text-anchor="start">Anti-mistake / 防误删</text>
<text x="56" y="526" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#1e3a5f" text-anchor="start">mv state.vscdb + wal + shm together. Do not delete workspaceStorage, Cache, or projects.</text>
<text x="56" y="548" font-family="Noto Sans CJK SC, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1e3a5f" text-anchor="start">旁路时三文件一起移走；勿删 workspaceStorage / Cache / projects。</text>
<text x="40" y="600" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#64748B" text-anchor="start">Tables: ItemTable (~976) · cursorDiskKV (~2.73M = bulk) · composerHeaders (~1,048)</text>
<text x="40" y="624" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#64748B" text-anchor="start">Freelist ~0 → pages in use. Teaching tree · no product logos.</text>
</svg>
