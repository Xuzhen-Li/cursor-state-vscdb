<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="28" y="32" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1e3a5f" text-anchor="start">Recovery flow when Cursor is unusable</text>
<text x="28" y="54" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#2A629A" text-anchor="start">不可用时的恢复分流</text>
<rect x="28" y="90" width="170" height="70" rx="10" fill="#1e3a5f"/>
<text x="113" y="118" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1. Quit fully</text>
<text x="113" y="140" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#FFFFFF" text-anchor="middle">Cmd+Q · no IDE</text>
<rect x="220" y="90" width="170" height="70" rx="10" fill="#1e3a5f"/>
<text x="305" y="118" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2. Diagnose</text>
<text x="305" y="140" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#FFFFFF" text-anchor="middle">size · rows · freelist</text>
<line x1="198" y1="125" x2="218" y2="125" stroke="#2A629A" stroke-width="3"/>
<rect x="420" y="78" width="552" height="332" rx="12" fill="#E8F0F8" stroke="#2A629A" stroke-width="1.5"/>
<text x="440" y="106" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1e3a5f" text-anchor="start">Choose a path / 二选一</text>
<rect x="440" y="128" width="240" height="40" rx="8" fill="#2A629A"/>
<text x="560" y="154" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Path A · keep old DB</text>
<rect x="440" y="184" width="240" height="36" rx="8" fill="#FFFFFF" stroke="#2A629A" stroke-width="1.5"/>
<text x="452" y="208" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#1e3a5f" text-anchor="start">3a. Export Chat (important threads)</text>
<rect x="440" y="228" width="240" height="36" rx="8" fill="#FFFFFF" stroke="#2A629A" stroke-width="1.5"/>
<text x="452" y="252" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#1e3a5f" text-anchor="start">4a. Developer: GC Agent KV Blobs</text>
<rect x="440" y="272" width="240" height="36" rx="8" fill="#FFFFFF" stroke="#2A629A" stroke-width="1.5"/>
<text x="452" y="296" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#1e3a5f" text-anchor="start">5a. Quit → re-check size / behavior</text>
<rect x="440" y="316" width="240" height="36" rx="8" fill="#FFFFFF" stroke="#2A629A" stroke-width="1.5"/>
<text x="452" y="340" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#1e3a5f" text-anchor="start">6a. Still huge? Export, trim long chats, GC</text>
<rect x="710" y="128" width="240" height="40" rx="8" fill="#B45309"/>
<text x="830" y="154" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Path B · mv bypass</text>
<rect x="710" y="184" width="240" height="36" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<text x="722" y="208" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#1e3a5f" text-anchor="start">3b. mv state.vscdb (+wal +shm) aside</text>
<rect x="710" y="228" width="240" height="36" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<text x="722" y="252" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#1e3a5f" text-anchor="start">    into backup (do not delete)</text>
<rect x="710" y="272" width="240" height="36" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<text x="722" y="296" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#1e3a5f" text-anchor="start">4b. Relaunch → fresh small DB</text>
<rect x="710" y="316" width="240" height="36" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<text x="722" y="340" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#1e3a5f" text-anchor="start">5b. New Chat works; old list may go</text>
<rect x="28" y="200" width="372" height="130" rx="10" fill="#FFFFFF" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="44" y="228" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1e3a5f" text-anchor="start">End state / 目标状态</text>
<text x="44" y="258" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#1e3a5f" text-anchor="start">· Small new or cleaned DB</text>
<text x="44" y="280" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#1e3a5f" text-anchor="start">· New Chat responds quickly</text>
<text x="44" y="302" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#1e3a5f" text-anchor="start">· Keep backup; transcripts remain</text>
<text x="28" y="450" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#1e3a5f" text-anchor="start">Prefer Path A when UI responds. Use Path B when stuck. Avoid DELETE+VACUUM.</text>
<text x="28" y="476" font-family="Noto Sans CJK SC, Noto Sans SC, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#2A629A" text-anchor="start">UI 还能动时优先 A；卡死用 B。勿直接 DELETE+VACUUM。</text>
<text x="28" y="508" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#1e3a5f" text-anchor="start">Always: move aside, never delete first. Confirm no Cursor IDE process.</text>
</svg>