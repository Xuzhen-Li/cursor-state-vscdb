<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="28" y="34" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1e3a5f" text-anchor="start">Safe recovery sequence</text>
<text x="28" y="56" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#2A629A" text-anchor="start">Quit → confirm no process → mv aside (not rm) → fresh DB → optional Export/GC</text>
<rect x="28" y="90" width="160" height="100" rx="10" fill="#1e3a5f"/>
<text x="108" y="118" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1. Quit fully</text>
<text x="38" y="148" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF" text-anchor="start">Cmd+Q</text>
<rect x="200" y="90" width="160" height="100" rx="10" fill="#1e3a5f"/>
<text x="280" y="118" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2. Confirm no process</text>
<text x="210" y="148" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF" text-anchor="start">ps · ignore UI helper</text>
<rect x="400" y="90" width="160" height="100" rx="10" fill="#B45309"/>
<text x="480" y="118" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3. mv three files aside</text>
<text x="410" y="148" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF" text-anchor="start">state.vscdb + wal + shm</text>
<text x="410" y="164" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF" text-anchor="start">NOT rm / delete</text>
<rect x="620" y="90" width="160" height="100" rx="10" fill="#166534"/>
<text x="700" y="118" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4. Relaunch</text>
<text x="630" y="148" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF" text-anchor="start">fresh small state.vscdb</text>
<rect x="800" y="90" width="160" height="100" rx="10" fill="#166534"/>
<text x="880" y="118" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5. Work again</text>
<text x="810" y="148" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#FFFFFF" text-anchor="start">New Chat replies fast</text>
<line x1="188" y1="140" x2="200" y2="140" stroke="#2A629A" stroke-width="3"/>
<line x1="388" y1="140" x2="400" y2="140" stroke="#2A629A" stroke-width="3"/>
<line x1="608" y1="140" x2="620" y2="140" stroke="#2A629A" stroke-width="3"/>
<line x1="788" y1="140" x2="800" y2="140" stroke="#2A629A" stroke-width="3"/>
<rect x="28" y="230" width="982" height="200" rx="12" fill="#E8F0F8" stroke="#2A629A" stroke-width="1.5"/>
<text x="48" y="260" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1e3a5f" text-anchor="start">Optional (if you still care about old chats &amp; have disk headroom)</text>
<text x="48" y="284" font-family="Noto Sans CJK SC, Arial, sans-serif" font-size="12" font-weight="normal" fill="#2A629A" text-anchor="start">可选：仍关心旧对话且磁盘有余量时</text>
<rect x="48" y="310" width="200" height="80" rx="8" fill="#FFFFFF" stroke="#2A629A" stroke-width="1.5"/>
<text x="148" y="342" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#1e3a5f" text-anchor="middle">A. Export Chat</text>
<text x="148" y="368" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#64748B" text-anchor="middle">important threads first</text>
<rect x="270" y="310" width="200" height="80" rx="8" fill="#FFFFFF" stroke="#2A629A" stroke-width="1.5"/>
<text x="370" y="342" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#1e3a5f" text-anchor="middle">B. GC Agent KV Blobs</text>
<text x="370" y="368" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#64748B" text-anchor="middle">Developer command</text>
<rect x="520" y="310" width="200" height="80" rx="8" fill="#FFFFFF" stroke="#2A629A" stroke-width="1.5"/>
<text x="620" y="342" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#1e3a5f" text-anchor="middle">C. Quit · re-check size</text>
<text x="620" y="368" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#64748B" text-anchor="middle">then behavior</text>
<rect x="760" y="310" width="200" height="80" rx="8" fill="#FFFFFF" stroke="#2A629A" stroke-width="1.5"/>
<text x="860" y="342" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#1e3a5f" text-anchor="middle">D. Still huge?</text>
<text x="860" y="368" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#64748B" text-anchor="middle">trim long chats · GC again</text>
<rect x="28" y="460" width="982" height="100" rx="10" fill="#FEF2F2" stroke="#9B1C1C" stroke-width="1.5"/>
<text x="48" y="490" font-family="Noto Sans CJK SC, Arial, sans-serif" font-size="14" font-weight="bold" fill="#9B1C1C" text-anchor="start">Do NOT / 禁止</text>
<text x="48" y="516" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#1e3a5f" text-anchor="start">Do not rm the DB. Do not VACUUM ~50 GB when free disk is tight (~1–2× space).</text>
<text x="48" y="540" font-family="Noto Sans CJK SC, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1e3a5f" text-anchor="start">勿直接删除；磁盘紧时勿对约 50 GB 库硬跑 VACUUM。</text>
<text x="28" y="590" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#64748B" text-anchor="start">Teaching sequence · English labels · no product logos</text>
</svg>